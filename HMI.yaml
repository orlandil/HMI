lvgl:
  pages:
    - id: main_page
      layout: 4x4
      styles: page_style

    - id: main_config_page
      styles: page_style
      layout: 4x4

    - id: brightness_config_page
      styles: page_style
      layout: 4x4
    
    - id: sensor_page
      styles: page_style
      layout: 4x4
  
    - id: ventola_sala_config_page
      styles: page_style
      layout: 4x4

    - id: ventola_terzo_piano_config_page
      styles: page_style
      layout: 4x4
    
    - id: deumidificatore_config_page
      styles: page_style
      layout: 4x4
    
    - id: termostato_config_page
      styles: page_style
      layout: 4x4
    
    - id: screen_saver_page
      widgets:
        - image:
            src: screen_saver_img
            align: CENTER
            on_click:
              then:
               - lvgl.page.show: main_page
               - script.execute: screensaver_trigger      
        - label:
            bg_opa: TRANSP
            align: bottom_mid
            id: screen_saver_time_label
            text_font: nunito_110
            text_color: burlywood
            text: '24:00'
        - label:
            bg_opa: TRANSP
            align: top_left
            id: screen_saver_temp_label
            text_font: nunito_72
            text_color: burlywood
            text: t_sala
        - label:
            bg_opa: TRANSP
            align: top_right
            id: screen_saver_hum_label
            text_font: nunito_72
            text_color: burlywood
            text: h_sala
       
  on_idle:
    - timeout: 30s
      then:
        - lvgl.page.show: screen_saver_page

