esphome:
  name: "hmi-sala_210"
  friendly_name: "HMI Sala_210"
  comment: "Guition ESP32-S3-4848S040 480px * 480px Smart Screen"
  on_boot:
    - priority: 400
      then:
        - script.execute: update_loading_page
        - script.execute: ha_connection_timeout
    - priority: -100
      then:
        - script.execute: set_brightness_mode_by_time
        - script.execute: screensaver_trigger


# Guition ESP32-S3-4848S040 480px X 480px Smart Screen
esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
       execute_from_psram: true

psram:
  mode: octal
  speed: 80MHz

preferences:
  flash_write_interval: 5min

logger:
  level: debug

# Substitution variables used through the codebase
substitutions:
  icon_font: mdi_icons_40
  text_font: nunito_20
  text_color: white
  bg_color: black
  button_on_color: "ep_orange"
  button_off_color: "very_dark_gray"
  icon_on_color: "yellow"
  icon_off_color: "gray"
  label_on_color: "white"
  label_off_color: "gray"
  button_text_color: "white"
  boot_screen_delay: 60s
  screen_night_hour: '21'
  screen_night_minute: '00'
  screen_height: '480'
  screen_width: '480'

globals:
  - id: touchscreen_daytime_brightness
    type: int
    restore_value: True
    initial_value: '100'   # percentuale
  - id: touchscreen_evening_brightness
    type: int
    restore_value: True
    initial_value: '80'
  - id: touchscreen_nighttime_brightness
    type: int
    restore_value: True
    initial_value: '70'
  - id: touchscreen_standby_day
    type: int
    restore_value: True
    initial_value: '50'
  - id: touchscreen_standby_evening
    type: int
    restore_value: True
    initial_value: '40'
  - id: touchscreen_standby_night
    type: int
    restore_value: True
    initial_value: '30'
  - id: touchscreen_idle_timeout_sec
    type: int
    restore_value: True
    initial_value: '120'   # secondi
  - id: touch_active
    type: bool
    restore_value: true
    initial_value: '0'

# Time update script - This is run once per second. Use it to update any time related labels.
script:
  - id: time_update
    then:
      - lvgl.label.update:
          id: time_label
          text: !lambda 'return id(system_time).now().strftime("%H:%M");'
      - lvgl.label.update:
          id: screen_saver_time_label
          text: !lambda 'return id(system_time).now().strftime("%H:%M");'
  - id: screensaver_trigger
    mode: restart
    then:
      - delay: 30s
      - lvgl.page.show: screen_saver_page
        
button:
  - platform: restart
    id: restart_button
    name: "HMI Restart"

