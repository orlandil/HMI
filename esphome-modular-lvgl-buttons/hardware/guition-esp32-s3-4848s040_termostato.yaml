# -------------------------------------------
# Internal outputs
# -------------------------------------------
output:
  # Backlight LED
  - platform: ledc
    pin: GPIO38  
    id: gpio_backlight_pwm
    frequency: 100Hz

  # Built in 240v/120v relay - Some versions of this switch have 3 relays some have 1
  - id: internal_relay_1
    platform: gpio
    pin: GPIO40
  - id: internal_relay_2
    platform: gpio
    pin: GPIO02
  - id: internal_relay_3
    platform: gpio
    pin: GPIO01

switch: 
  - platform: output 
    name: "Relay 1" 
    id: switch_internal_relay_1
    output: internal_relay_1
    
light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: ALWAYS_ON

# -------------------------------------------
# Touchscreen gt911 i2c
# -------------------------------------------
i2c:
  - id: bus_a
    sda:
      number: GPIO19
    scl:
      number: GPIO45
      ignore_strapping_warning: true
  - id: bus_b
    sda:
      number: GPIO43
    scl:
      number: GPIO44

sensor:
  - platform: aht10
    variant: aht10
    i2c_id: bus_b
    temperature:
      name: Temepratura_Termostato
      id: t_termostato
      filters:
        - median:
           window_size: 4
           send_every: 4
           send_first_at: 3
    humidity:
      name: Umidita_Termostato
      id: h_termostato
      filters: 
        - median:
            window_size: 4
            send_every: 4
            send_first_at: 4
    address: 0x38
    update_interval: 60s

touchscreen:
  platform: gt911
  id: my_touchscreen
  display: my_display
  i2c_id: bus_a
  transform:
    mirror_x: false
    mirror_y: false
    swap_xy: false
  #on_touch:
    # - logger.log:
          # format: Touch at (%d, %d)
          # args: [touch.x, touch.y]
    # - lambda: |-
          # ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
              # touch.x,
              # touch.y,
              # touch.x_raw,
              # touch.y_raw
              # );

# -------------------------------------------
# Display st7701s spi
# -------------------------------------------
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

display:
  - platform: st7701s
    id: my_display
    update_interval: never
    auto_clear_enabled: False
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: False
    #rotation: 180
    dimensions:
      width: 480
      height: 480
    cs_pin: GPIO39
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    pclk_frequency: 12MHz
    pclk_inverted: False
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    init_sequence:
      - 1
      # Custom sequences are an array, first byte is command, the rest are data.
      - [ 0xFF, 0x77, 0x01, 0x00, 0x00, 0x10 ] # CMD2_BKSEL_BK0
      - [ 0xCD, 0x00 ] # disable MDT flag
    data_pins:
      red:
        - 11        #r1
        - 12        #r2
        - 13        #r3
        - 14        #r4
        - 0         #r5
      green:
        - 8         #g0
        - 20        #g1
        - 3         #g2
        - 46        #g3
        - 9         #g4
        - 10        #g5
      blue:
        - 4         #b1
        - 5         #b2
        - 6         #b3
        - 7         #b4
        - 15        #b5
